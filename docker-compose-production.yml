services:
  pocketbase_imp:
    build:
      context: .
      dockerfile: Dockerfile.pb
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - pocketbase_data:/pb/pb_data
    networks:
      - coolify

  imp:
    build:
      context: .
      dockerfile: Dockerfile.vue.production
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "3535:80"
    depends_on:
      - pocketbase_imp
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Definimos la regla de Host explícita
      - "traefik.http.routers.imp-http.rule=Host(`impresora.lan`)"
      # Forzamos a que el router use únicamente el entrypoint de HTTP (puerto 80)
      - "traefik.http.routers.imp-http.entrypoints=http"
      # Apuntamos al servicio interno en el puerto 80 del contenedor
      - "traefik.http.services.imp-http.loadbalancer.server.port=80"
      # Desactivamos explícitamente cualquier TLS/SSL para este router
      - "traefik.http.routers.imp-http.tls=false"

  cors_proxy:
    image: node:18-alpine
    restart: unless-stopped
    command: >
      node -e "
      const http = require('http');
      const https = require('https');

      http.createServer((req, res) => {
        res.setHeader('Access-Control-Allow-Origin', '*');
        res.setHeader(
          'Access-Control-Allow-Methods',
          'GET, POST, OPTIONS, PUT, PATCH, DELETE'
        );
        res.setHeader('Access-Control-Allow-Headers', '*');

        if (req.method === 'OPTIONS') {
          res.writeHead(204);
          res.end();
          return;
        }

        let targetUrl = req.url;

        if (
          targetUrl.startsWith('/https:/') &&
          !targetUrl.startsWith('/https://')
        ) {
          targetUrl = 'https://' + targetUrl.substring(8);
        } else if (targetUrl.startsWith('/http')) {
          targetUrl = targetUrl.substring(1);
        } else if (!targetUrl.startsWith('http')) {
          targetUrl = 'https://api.mercadopago.com' + req.url;
        }

        const client = targetUrl.startsWith('https://')
          ? https
          : http;

        const proxyReq = client.request(
          targetUrl,
          {
            method: req.method,
            headers: {
              ...req.headers,
              host: 'api.mercadopago.com'
            }
          },
          (proxyRes) => {
            res.writeHead(
              proxyRes.statusCode,
              proxyRes.headers
            );
            proxyRes.pipe(res);
          }
        );

        proxyReq.on('error', (err) => {
          console.error(
            'Error en proxy:',
            err.message
          );
          res.writeHead(500);
          res.end(err.message);
        });

        req.pipe(proxyReq);

      }).listen(
        8080,
        '0.0.0.0',
        () => {
          console.log(
            'Proxy CORS corriendo en puerto 8080'
          );
        }
      );
      "
    ports:
      - "8086:8080"
    networks:
      - coolify

volumes:
  pocketbase_data:

networks:
  coolify:
    external: true