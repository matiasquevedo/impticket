services:

  # ================================================
  # BACKEND: PocketBase
  # ================================================

  pocketbase_imp:
    build:
      context: .
      dockerfile: Dockerfile.pb

    restart: unless-stopped

    # El puerto queda disponible únicamente dentro
    # de la red interna de Docker/Coolify.
    expose:
      - "8080"

    # Volumen persistente para no perder:
    # - usuarios
    # - colecciones
    # - registros
    # - archivos subidos
    volumes:
      - pocketbase_data:/pb/pb_data


  # ================================================
  # FRONTEND: Vue + Vite compilado + Nginx
  # ================================================

  imp:
    build:
      context: .
      dockerfile: Dockerfile.vue

    restart: unless-stopped

    # Nginx escucha internamente en el puerto 80.
    expose:
      - "80"

    depends_on:
      - pocketbase_imp


# ==================================================
# VOLÚMENES PERSISTENTES
# ==================================================

volumes:
  pocketbase_data: